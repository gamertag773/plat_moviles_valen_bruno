<ion-content class="login-bg">
  <div class="login-wrapper">
    <div class="login-card">
      <!-- Logo centrado en la parte superior -->
      <div class="logo-container">
        <img src="assets\cet.30.logo.webp" alt="Logo Colegio Técnico CET N° 30" />
      </div>

      <h1 class="login-title">Iniciar Sesión</h1>

      <div class="form-group">
        <label class="input-label">Usuario o Correo</label>
        <ion-input
          class="custom-input"
          type="email"
          placeholder="Ingresa tu correo">
        </ion-input>
      </div>

      <div class="form-group">
        <label class="input-label">Contraseña</label>
        <ion-input
          class="custom-input"
          type="password"
          placeholder="••••••••••">
        </ion-input>
      </div>

      <ion-button expand="block" shape="round" class="login-button">
        INGRESAR
      </ion-button>
    </div>
  </div>
</ion-content>
